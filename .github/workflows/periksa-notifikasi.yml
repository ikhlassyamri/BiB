# ══════════════════════════════════════════════════════════════════
#  Periksa notifikasi — alat DIAGNOSA, tidak mengirim apa pun
# ------------------------------------------------------------------
#  Dibuat Agu 2026 karena dua keluhan pemilik sekaligus: notifikasi
#  balasan komentar tidak pernah sampai, dan notifikasi artikel baru
#  juga tidak muncul di HP kedua. Padahal log workflow "Notifikasi
#  artikel baru" mencetak "TERKIRIM" dengan id dari OneSignal.
#
#  Sebabnya: id dari OneSignal cuma bukti KIRIMANNYA DIBUAT, bukan
#  bukti ada yang menerimanya. Yang menjawab pertanyaan itu cuma tiga
#  angka di sisi OneSignal — jumlah pelanggan, jumlah pelanggan yang
#  bisa dikirimi, dan `successful` tiap kiriman. Ketiganya tidak
#  terlihat dari kode dan tidak terlihat dari log pengirim.
#
#  Alur ini MEMBACA saja (GET), tidak pernah POST. Aman dijalankan
#  kapan pun, tidak menghasilkan notifikasi ke siapa pun.
#
#  Kuncinya tetap rahasia: yang dicetak cuma kolom yang dipilih satu
#  per satu (daftar putih). `basic_auth_key` milik jawaban OneSignal
#  SENGAJA tidak pernah dicetak — itu kunci juga.
# ══════════════════════════════════════════════════════════════════

name: Periksa notifikasi

on:
  workflow_dispatch:
    inputs:
      osid:
        description: >-
          (opsional) id langganan SATU perangkat untuk diuji kirimi.
          Diisi = satu notifikasi uji dikirim HANYA ke perangkat itu,
          dan jawaban mentah OneSignal dicetak. Dikosongkan = tidak ada
          kiriman sama sekali, alur ini cuma membaca.
        required: false
        default: ''

jobs:
  periksa:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Ambil kode
        uses: actions/checkout@v4

      - name: Tanya OneSignal
        env:
          REST_KEY: ${{ secrets.ONESIGNAL_REST_API_KEY }}
          APP_ID: b08cc556-e8af-4fd1-a046-0c6ae3e1c065
          OSID_UJI: ${{ inputs.osid }}
        run: |
          python3 -u - <<'PY'
          import json, os, sys, urllib.error, urllib.request

          kunci = os.environ.get('REST_KEY', '').strip()
          app   = os.environ['APP_ID']
          if not kunci:
              print('::error::Secret ONESIGNAL_REST_API_KEY kosong di repo ini.')
              sys.exit(1)

          print(f'panjang kunci: {len(kunci)} huruf, '
                f'awalan "{kunci[:4]}…" (sisanya sengaja tidak dicetak)')

          SKEMA = ['Key', 'Basic']

          def ambil(jalur):
              """GET ke OneSignal. Mencoba kedua skema Authorization."""
              galat = []
              for skema in SKEMA:
                  req = urllib.request.Request(
                      'https://api.onesignal.com' + jalur,
                      headers={'Authorization': f'{skema} {kunci}',
                               'Accept': 'application/json'},
                      method='GET')
                  try:
                      with urllib.request.urlopen(req, timeout=30) as r:
                          return skema, json.loads(r.read().decode())
                  except urllib.error.HTTPError as e:
                      galat.append(f'{skema}→HTTP {e.code} '
                                   f'{e.read().decode(errors="replace")[:160]}')
                  except Exception as e:
                      galat.append(f'{skema}→{e}')
              return None, galat

          # ─── 1. Aplikasi: berapa pelanggannya, dan ORIGIN-nya ke mana ───
          print('\n══ 1. APLIKASI ONESIGNAL ══')
          skema, hasil = ambil(f'/apps/{app}')
          if skema is None:
              print('::error::Tidak bisa membaca aplikasi. ' + ' | '.join(hasil))
              print('  Kalau keduanya 401/403: kunci yang dipakai BUKAN REST API '
                    'Key (atau sudah dicabut). Ambil ulang di OneSignal → '
                    'Settings → Keys & IDs → REST API Key.')
              sys.exit(1)

          print(f'  skema Authorization yang diterima: "{skema}"')
          # daftar putih — jangan pernah cetak seluruh jawaban, ada kunci di dalamnya
          for k in ('name', 'players', 'messageable_players',
                    'chrome_web_origin', 'site_name', 'chrome_web_sub_domain',
                    'safari_site_origin', 'chrome_web_default_notification_icon'):
              print(f'  {k}: {hasil.get(k)!r}')

          jml   = hasil.get('players') or 0
          bisa  = hasil.get('messageable_players') or 0
          asal  = (hasil.get('chrome_web_origin') or '')

          print('\n  ── bacaan ──')
          if jml == 0:
              print('  ❗ NOL pelanggan terdaftar. Tidak ada notifikasi yang bisa '
                    'sampai ke siapa pun, apa pun isi kodenya.')
          elif bisa == 0:
              print(f'  ❗ Ada {jml} pelanggan tapi NOL yang bisa dikirimi '
                    '(messageable_players = 0) — langganannya ada tapi mati/kadaluwarsa.')
          else:
              print(f'  ✅ {bisa} dari {jml} pelanggan bisa dikirimi.')
          if 'joinbib.id' not in asal:
              print(f'  ❗ chrome_web_origin = {asal!r} — TIDAK menyebut joinbib.id. '
                    'Kalau origin situsnya beda, browser menolak langganan diam-diam.')
          else:
              print(f'  ✅ origin cocok dengan situs: {asal}')

          # ─── 2. Segmen: nama mana yang benar-benar ada ───
          print('\n══ 2. SEGMEN ══')
          skema2, seg = ambil(f'/apps/{app}/segments')
          if skema2 is None:
              print('  (tidak bisa dibaca: ' + ' | '.join(seg) + ')')
          else:
              daftar = seg.get('segments') if isinstance(seg, dict) else seg
              for s in (daftar or []):
                  print(f'  - {s.get("name")!r}  (id {s.get("id")})')
              nama = {s.get('name') for s in (daftar or [])}
              for dicoba in ('Total Subscriptions', 'Subscribed Users', 'Active Users'):
                  print(f'  dipakai pengirim: {dicoba!r} → '
                        + ('ADA' if dicoba in nama else 'TIDAK ADA'))

          # ─── 3. Kiriman terakhir: berapa yang BENAR-BENAR sampai ───
          print('\n══ 3. KIRIMAN TERAKHIR ══')
          skema3, nots = ambil(f'/notifications?app_id={app}&limit=50')
          if skema3 is None:
              print('  (tidak bisa dibaca: ' + ' | '.join(nots) + ')')
          else:
              daftar = nots.get('notifications') or []
              if not daftar:
                  print('  Tidak ada satu pun kiriman tercatat di akun ini.')
              print(f'  ({len(daftar)} kiriman terakhir terbaca; 10 teratas dirinci)')
              for n in daftar[:10]:
                  judul = (n.get('headings') or {}).get('en', '')[:58]
                  print(f'\n  · {judul!r}')
                  print(f'    id          : {n.get("id")}')
                  print(f'    segmen      : {n.get("included_segments")}')
                  print(f'    berhasil    : {n.get("successful")}')
                  print(f'    gagal       : {n.get("failed")}')
                  print(f'    galat       : {n.get("errored")}')
                  print(f'    sisa antre  : {n.get("remaining")}')
                  print(f'    selesai pada: {n.get("completed_at")}')
                  if n.get('platform_delivery_stats'):
                      print(f'    per platform: '
                            f'{json.dumps(n["platform_delivery_stats"], ensure_ascii=False)[:300]}')

              print('\n  ── bacaan ──')
              print('  "berhasil" = jumlah perangkat yang benar-benar menerima.')
              print('  Kalau id-nya ada tapi berhasil = 0, kiriman DIBUAT tapi')
              print('  TIDAK PERNAH SAMPAI — persis gejala yang dikeluhkan.')

              # ── push BALASAN KOMENTAR pernah ada atau tidak ──
              # Judulnya dipatok worker: "Komentarmu dibalas" (dari BiB) dan
              # "<nama> membalas komentarmu" (antar-pembaca).
              print('\n══ 4. PUSH BALASAN KOMENTAR ══')
              balas = [n for n in daftar
                       if 'komentarmu' in ((n.get('headings') or {})
                                           .get('en', '') or '').lower()]
              if not balas:
                  print(f'  ❗ TIDAK ADA satu pun push balasan komentar di '
                        f'{len(daftar)} kiriman terakhir.')
                  print('  Artinya worker TIDAK PERNAH berhasil membuat kiriman itu —')
                  print('  bukan dibuat lalu tidak sampai. Sebab yang mungkin:')
                  print('    · osid pengomentar tidak pernah tersimpan '
                        '(kirimPush → "tanpa osid"), atau')
                  print('    · balasan BiB sudah ada sebelum jalur push dipasang.')
              else:
                  for n in balas:
                      print(f'  · {(n.get("headings") or {}).get("en")!r} '
                            f'berhasil={n.get("successful")} '
                            f'gagal={n.get("failed")} id={n.get("id")}')

          # ─── 5. Kesehatan langganan: kenapa separuhnya tidak bisa dikirimi ───
          # 165 terdaftar tapi 85 yang bisa dikirimi — 80 sisanya perlu
          # dijelaskan, karena HP pemilik bisa jadi salah satunya.
          # Endpoint /players ini yang lama (host onesignal.com), masih
          # satu-satunya yang memerinci nasib tiap langganan.
          print('\n══ 5. KESEHATAN LANGGANAN ══')
          pemain = None
          for pangkal in ('https://onesignal.com/api/v1', 'https://api.onesignal.com'):
              for skema in SKEMA:
                  req = urllib.request.Request(
                      f'{pangkal}/players?app_id={app}&limit=300',
                      headers={'Authorization': f'{skema} {kunci}',
                               'Accept': 'application/json'})
                  try:
                      with urllib.request.urlopen(req, timeout=30) as r:
                          pemain = json.loads(r.read().decode())
                          break
                  except Exception:
                      continue
              if pemain:
                  break

          if not pemain:
              print('  (daftar langganan tidak bisa dibaca lewat API ini)')
          else:
              baris = pemain.get('players') or []
              print(f'  {len(baris)} langganan terbaca dari {pemain.get("total_count")}')
              # notification_types: 1 = berlangganan, -2 = dimatikan pemakai,
              # 0/-31 dst = tidak aktif. invalid_identifier = alamat push mati.
              hitung, mati, jenis = {}, 0, {}
              for pl in baris:
                  nt = pl.get('notification_types')
                  hitung[nt] = hitung.get(nt, 0) + 1
                  if pl.get('invalid_identifier'):
                      mati += 1
                  b = (pl.get('device_type'), pl.get('device_os'))
                  jenis[b] = jenis.get(b, 0) + 1
              # notification_types TIDAK lagi diisi versi API ini — semuanya
              # None. Jangan dibaca sebagai "nol yang berlangganan": itu
              # kolom yang hilang, bukan angka nol. Yang sahih di sini
              # cuma invalid_identifier, dan jumlahnya memang cocok dengan
              # selisih players − messageable_players.
              if set(hitung) == {None}:
                  print('\n  notification_types: tidak diisi versi API ini '
                        '(bukan berarti nol) — diabaikan.')
              else:
                  print('\n  notification_types (1 = berlangganan aktif):')
                  for k2 in sorted(hitung, key=lambda x: (x is None, x)):
                      print(f'    {k2!r}: {hitung[k2]}')
              print(f'  invalid_identifier (alamat push MATI): {mati}')
              print(f'\n  ── bacaan ──')
              print(f'  langganan tercatat : {len(baris)}')
              print(f'  alamat push mati   : {mati}')
              print(f'  bisa dikirimi      : {len(baris) - mati}')
              if mati:
                  print('  Langganan ber-alamat MATI tidak menerima apa pun —')
                  print('  termasuk push balasan komentar yang ditujukan khusus')
                  print('  ke id-nya, dan OneSignal menolaknya tanpa membuat')
                  print('  catatan kiriman (itu sebabnya seksi 4 kosong).')
                  print('  Perangkat yang alamatnya mati harus BERLANGGANAN ULANG:')
                  print('  matikan notifikasi situs di peramban, muat ulang')
                  print('  joinbib.id/artikel, lalu nyalakan lagi.')

          # ─── 6. Uji kirim ke SATU perangkat (opsional) ───
          uji = os.environ.get('OSID_UJI', '').strip()
          if not uji:
              print('\n══ 6. UJI KIRIM ══\n  (dilewati — kolom osid dikosongkan, '
                    'jadi alur ini tidak mengirim apa pun)')
          else:
              print('\n══ 6. UJI KIRIM KE SATU PERANGKAT ══')
              print(f'  sasaran: {uji[:8]}… (satu langganan saja)')
              muatan = {
                  'app_id': app,
                  'include_subscription_ids': [uji],
                  'headings': {'en': 'Uji notifikasi BiB'},
                  'contents': {'en': 'Kalau ini muncul, jalur push ke perangkat '
                                     'ini hidup.'},
                  'url': 'https://joinbib.id/artikel',
                  'chrome_web_icon': 'https://joinbib.id/notif-icon-192.png',
              }
              for skema in SKEMA:
                  req = urllib.request.Request(
                      'https://api.onesignal.com/notifications',
                      data=json.dumps(muatan).encode(),
                      headers={'Content-Type': 'application/json; charset=utf-8',
                               'Authorization': f'{skema} {kunci}'},
                      method='POST')
                  try:
                      with urllib.request.urlopen(req, timeout=30) as r:
                          jw = json.loads(r.read().decode())
                  except urllib.error.HTTPError as e:
                      print(f'  skema {skema}: HTTP {e.code} '
                            f'{e.read().decode(errors="replace")[:200]}')
                      continue
                  except Exception as e:
                      print(f'  skema {skema}: {e}')
                      continue
                  print(f'  skema {skema} → {json.dumps(jw, ensure_ascii=False)[:300]}')
                  if jw.get('errors'):
                      print('  ❗ OneSignal MENOLAK: langganan itu tidak aktif. '
                            'Inilah yang dialami worker tiap membalas komentar.')
                  elif jw.get('id'):
                      print('  ✅ Diterima. Kalau notifikasinya TETAP tidak muncul '
                            'di HP, penahannya ada di OS/peramban, bukan di sini.')
                  break
          PY

      # Kotak komentarnya sendiri: kalau tidak ada satu pun komentar
      # tersimpan, antrean balasan memang kosong bukan karena rusak.
      # /ambil publik (tanpa token) dan sudah membuang osid lewat publik().
      - name: Periksa kotak komentar
        run: |
          python3 -u - <<'PY'
          import json, os, urllib.error, urllib.request

          WORKER = 'https://komentar-artikel.ikhlassyamribusiness.workers.dev'
          slugs = sorted(
              f[:-5] for f in os.listdir('artikel')
              if f.endswith('.html') and not f.startswith(('index', 'seri-')))
          print(f'{len(slugs)} artikel di repo; semuanya ditanya satu per satu\n')

          total = jml_balasan = jml_bib = berkomentar = 0
          for slug in slugs:
              req = urllib.request.Request(
                  f'{WORKER}/ambil?slug={slug}',
                  headers={'User-Agent': 'bib-periksa-notifikasi'})
              try:
                  with urllib.request.urlopen(req, timeout=20) as r:
                      data = json.loads(r.read().decode())
              except Exception as e:
                  print(f'  ! {slug}: {e}')
                  continue
              kom = data.get('komentar') or []
              if not kom:
                  continue
              berkomentar += 1
              total += len(kom)
              rinci = []
              for k in kom:
                  bal = k.get('balasan') or []
                  jml_balasan += len(bal)
                  bib = sum(1 for b in bal if b.get('bib'))
                  jml_bib += bib
                  rinci.append(f'{len(bal)} balasan ({bib} dari BiB)')
              print(f'  {slug}: {len(kom)} komentar — ' + '; '.join(rinci))

          print(f'\n  ── bacaan ──')
          print(f'  artikel berkomentar : {berkomentar}')
          print(f'  komentar            : {total}')
          print(f'  balasan             : {jml_balasan} (dari BiB: {jml_bib})')
          if total == 0:
              print('  ❗ Kotak komentar KOSONG di semua artikel. Antrean balasan')
              print('    memang tidak punya apa-apa untuk dikerjakan — dan push')
              print('    "komentarmu dibalas" tidak pernah punya kesempatan jalan.')
          elif jml_bib == 0:
              print('  ❗ Ada komentar tapi BiB belum pernah membalas satu pun.')
          else:
              print(f'  BiB sudah membalas {jml_bib} kali — tiap balasan itu')
              print('    seharusnya memicu satu push "Komentarmu dibalas".')
          PY
