# ══════════════════════════════════════════════════════════════════
#  Kirim notifikasi otomatis tiap ADA ARTIKEL BARU
# ------------------------------------------------------------------
#  Cara kerja: begitu ada file HTML BARU masuk ke folder /artikel/
#  dan ke-push ke main, alur ini membaca judul & ringkasannya dari
#  file itu, lalu mengirim push lewat OneSignal.
#
#  SYARAT SEKALI PASANG:
#    Repo GitHub → Settings → Secrets and variables → Actions
#    → New repository secret
#      Name  : ONESIGNAL_REST_API_KEY
#      Value : REST API Key dari OneSignal
#              (Settings → Keys & IDs → REST API Key)
#    Kunci ini RAHASIA. Disimpan sebagai Secret, tidak pernah
#    tertulis di kode dan tidak terlihat di log.
#
#  CATATAN:
#    - Hanya file BARU yang memicu notifikasi. Mengedit artikel lama
#      TIDAK mengirim apa-apa, jadi aman kalau sekadar perbaikan.
#    - Mau menerbitkan tanpa notifikasi? Tulis [tanpa-notif] di mana
#      saja dalam pesan commit.
# ══════════════════════════════════════════════════════════════════

name: Notifikasi artikel baru

on:
  push:
    branches: [main]
    paths:
      - 'artikel/**.html'

# Dua push beruntun bisa memicu dua run yang berjalan BERSAMAAN, dan
# kalau rentang diff run kedua ikut mencakup commit artikelnya, artikel
# yang sama terkirim dua kali (kejadian Agu 2026: "Temasek Invest di
# India" dan "PRDA Buyback Saham" masing-masing terkirim dobel ke 85
# pelanggan, berjarak 1 detik). Ini pagar pertama: run berikutnya
# MENUNGGU, tidak menyalip. Pagar keduanya external_id di bawah.
concurrency:
  group: notifikasi-artikel-baru
  cancel-in-progress: false

jobs:
  kirim:
    runs-on: ubuntu-latest
    steps:
      - name: Ambil kode
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Cari artikel yang baru ditambahkan
        id: cari
        run: |
          BEFORE="${{ github.event.before }}"
          if [ -z "$BEFORE" ] || [ "$BEFORE" = "0000000000000000000000000000000000000000" ] \
             || ! git cat-file -e "$BEFORE^{commit}" 2>/dev/null; then
            BEFORE="$(git rev-parse HEAD~1 2>/dev/null || echo '')"
          fi

          if [ -z "$BEFORE" ]; then
            echo "Tidak ada pembanding, lewati."
            echo "file=" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          BARU="$(git diff --name-only --diff-filter=A "$BEFORE" "${{ github.sha }}" -- 'artikel/*.html' \
                  | grep -v '^artikel/index.html$' || true)"

          echo "Artikel baru terdeteksi:"
          echo "${BARU:-(tidak ada)}"
          {
            echo "file<<EOF"
            echo "$BARU"
            echo "EOF"
          } >> "$GITHUB_OUTPUT"

      # GitHub Pages butuh 1-5 menit membangun halamannya. Notifikasi yang
      # dikirim lebih dulu = pembaca mengklik dan mendarat di 404 (ditegur
      # pemilik, Agu 2026). Maka sebelum mengirim, tunggu sampai alamat
      # artikelnya benar-benar menjawab 200 — dicek tiap 20 detik, paling
      # lama 10 menit. Lewat 10 menit pun notifikasi tetap dikirim (lebih
      # baik telat-tapi-terkirim daripada hilang), tinggal peringatannya
      # tercatat di log.
      - name: Tunggu halamannya tayang
        if: steps.cari.outputs.file != ''
        env:
          DAFTAR: ${{ steps.cari.outputs.file }}
        run: |
          for f in $DAFTAR; do
            slug="$(basename "$f" .html)"
            url="https://joinbib.id/artikel/$slug"
            echo "menunggu $url"
            kode=""
            batas=$((SECONDS + 600))
            while [ $SECONDS -lt $batas ]; do
              kode="$(curl -s -o /dev/null -w '%{http_code}' "$url" || echo 000)"
              if [ "$kode" = "200" ]; then
                echo "  tayang (200) setelah ${SECONDS}s"
                break
              fi
              echo "  belum ($kode), cek lagi 20 detik"
              sleep 20
            done
            if [ "$kode" != "200" ]; then
              echo "::warning::$url belum 200 setelah 10 menit; notifikasi tetap dikirim."
            fi
          done

      - name: Kirim push lewat OneSignal
        if: steps.cari.outputs.file != ''
        env:
          REST_KEY: ${{ secrets.ONESIGNAL_REST_API_KEY }}
          APP_ID: b08cc556-e8af-4fd1-a046-0c6ae3e1c065
          PESAN_COMMIT: ${{ github.event.head_commit.message }}
          DAFTAR: ${{ steps.cari.outputs.file }}
        run: |
          python3 - <<'PY'
          import html, json, os, re, sys, urllib.error, urllib.request, uuid

          if '[tanpa-notif]' in os.environ.get('PESAN_COMMIT', ''):
              print('Pesan commit minta tanpa notifikasi. Dilewati.')
              sys.exit(0)

          kunci = os.environ.get('REST_KEY', '').strip()
          if not kunci:
              print('::error::Secret ONESIGNAL_REST_API_KEY belum dipasang di repo.')
              sys.exit(1)

          def ambil(pola, teks, bawaan=''):
              m = re.search(pola, teks, re.I | re.S)
              return html.unescape(m.group(1)).strip() if m else bawaan

          berkas = [f for f in os.environ.get('DAFTAR', '').split('\n') if f.strip()]
          gagal = False

          for f in berkas:
              try:
                  isi = open(f, encoding='utf-8').read()
              except OSError as e:
                  print(f'::warning::Tidak bisa membaca {f}: {e}')
                  continue

              judul = ambil(r'<title>(.*?)</title>', isi)
              # buang embel-embel merek di ujung judul
              judul = re.split(r'\s+[|—–-]\s+BiB', judul)[0].strip() or 'Artikel baru di BiB'

              ringkas = (ambil(r'property=["\']og:description["\']\s+content=["\'](.*?)["\']', isi)
                         or ambil(r'name=["\']description["\']\s+content=["\'](.*?)["\']', isi)
                         or 'Baca tulisan terbaru di joinbib.id')
              if len(ringkas) > 160:
                  ringkas = ringkas[:157].rsplit(' ', 1)[0] + '…'

              # NOTIFIKASI BERGAMBAR (keputusan pemilik, Agu 2026): thumbnail
              # artikel ikut tampil besar di notifikasi (chrome_web_image),
              # judul + ringkasan di atasnya — susunan persisnya milik OS.
              gambar = ambil(r'property=["\']og:image["\']\s+content=["\'](.*?)["\']', isi)
              if gambar and not gambar.startswith('http'):
                  gambar = ''

              # AWALAN JUDUL NOTIFIKASI menurut jenis+topik artikel
              # (keputusan pemilik, Agu 2026 — dulu semua "Artikel baru:").
              # Sumbernya kicker di artikel itu sendiri, mis. "BERITA · AI"
              # atau "EDUKASI · ILMU JUALAN" → "Berita AI", "Edukasi Jualan".
              # Kisah sukses berdiri sendiri tanpa topik: "Kisah Sukses".
              def rapikan_kata(s):
                  keluar = []
                  for w in s.split():
                      # singkatan biar tidak jadi "Ai"/"Seo"
                      keluar.append(w if (w.isupper() and len(w) <= 4)
                                    else w.capitalize())
                  return ' '.join(keluar)

              kicker = ambil(r'<div class=["\']kick["\']>(.*?)</div>', isi)
              awalan = 'Artikel baru'
              if kicker:
                  bagian = [b.strip() for b in re.split(r'[·|]', kicker) if b.strip()]
                  jenis = rapikan_kata(bagian[0]) if bagian else ''
                  topik = rapikan_kata(bagian[1]) if len(bagian) > 1 else ''
                  # "ILMU JUALAN" → "Jualan" (yang dibaca orang di layar kunci
                  # cuma beberapa kata pertama, jadi jangan boros)
                  topik = re.sub(r'^ilmu\s+', '', topik, flags=re.I)
                  if jenis.lower().startswith('kisah'):
                      awalan = 'Kisah Sukses'          # berdiri sendiri
                  elif jenis and topik:
                      awalan = f'{jenis} {topik}'
                  elif jenis:
                      awalan = jenis

              alamat = ambil(r'rel=["\']canonical["\']\s+href=["\'](.*?)["\']', isi)
              if not alamat:
                  slug = os.path.basename(f)[:-5]
                  alamat = f'https://joinbib.id/artikel/{slug}'

              # Nama segmen bawaan OneSignal BERBEDA menurut umur akun:
              # akun lama "Subscribed Users", akun baru "Total Subscriptions".
              #
              # Kalau namanya tidak cocok, OneSignal TIDAK bilang "segmen tidak
              # ditemukan". Ia membalas HTTP 200 dengan
              #   {"id": "", "errors": ["All included players are not subscribed"]}
              # — kalimat yang terdengar seperti "belum ada pelanggan", padahal
              # pelanggannya ada puluhan. Pesan itu yang sempat menyesatkan.
              #
              # Karena itu semua nama dicoba bergantian sampai ada yang benar-benar
              # menghasilkan notifikasi. Nama yang berhasil dicetak, supaya sekali
              # ketahuan tidak perlu ditebak lagi.
              SEGMEN = ['Total Subscriptions', 'Subscribed Users', 'Active Users']

              # KUNCI IDEMPOTEN (Agu 2026). external_id membuat OneSignal
              # menolak kiriman kedua dengan kunci yang sama, jadi artikel
              # yang sama tidak bisa terkirim dua kali — entah karena dua
              # run balapan, entah karena satu run salah membaca jawaban
              # lalu mengulang ke kombinasi berikutnya. Kuncinya DITURUNKAN
              # dari alamat kanonik artikel (uuid5), bukan diacak: acak
              # berarti tiap run punya kunci baru dan tidak menahan apa pun.
              # Konsekuensi yang perlu diingat: satu alamat artikel = satu
              # notifikasi SELAMANYA. Mau mengirim ulang alamat yang sama
              # (mis. artikel ditarik lalu diterbitkan lagi) harus lewat
              # dasbor OneSignal, bukan dari sini.
              kunci_kiriman = str(uuid.uuid5(uuid.NAMESPACE_URL, alamat))

              print(f'→ [{awalan}] {judul}\n  {alamat}\n  kunci {kunci_kiriman}')

              terkirim = False
              # 401/403 di SEMUA percobaan = kuncinya yang ditolak, bukan
              # nama segmennya. Bedanya penting: pesan lama menuduh nama
              # segmen dan mengirim orang mencari ke tempat yang salah,
              # padahal segmennya benar dan kuncinya yang diputar
              # (Agu 2026 — kunci diganti di repo agen, salinan di repo
              # ini ketinggalan, artikel Paul Buchheit tidak terkirim).
              ditolak_kunci = False
              # OneSignal baru memakai "Key <token>"; sebagian akun lama "Basic <token>"
              for skema, segmen in [(sk, sg) for sk in ('Key', 'Basic') for sg in SEGMEN]:
                  muatan = {
                      'app_id': os.environ['APP_ID'],
                      'external_id': kunci_kiriman,
                      'included_segments': [segmen],
                      'headings': {'en': f'{awalan}: {judul}'},
                      'contents': {'en': ringkas},
                      'url': alamat,      # klik notif → langsung ke artikelnya
                      # ikon merek di badan notifikasi (192px, dari favicon)
                      'chrome_web_icon': 'https://joinbib.id/notif-icon-192.png',
                      'firefox_icon': 'https://joinbib.id/notif-icon-192.png',
                  }
                  if gambar:
                      muatan['chrome_web_image'] = gambar
                  permintaan = urllib.request.Request(
                      'https://api.onesignal.com/notifications',
                      data=json.dumps(muatan).encode(),
                      headers={
                          'Content-Type': 'application/json; charset=utf-8',
                          'Authorization': f'{skema} {kunci}',
                      },
                      method='POST',
                  )
                  try:
                      with urllib.request.urlopen(permintaan, timeout=30) as r:
                          hasil = json.loads(r.read().decode())

                      # HTTP 200 BUKAN bukti terkirim. OneSignal membalas 200
                      # dengan {"errors": [...]} kalau segmennya tidak ada atau
                      # tidak ada pelanggan, dan id-nya kosong. Versi sebelumnya
                      # mencetak "✅ terkirim" untuk balasan seperti itu — jadi
                      # workflow hijau, notifikasi tidak pernah sampai, dan tidak
                      # ada yang tahu.
                      # CATATAN Agu 2026: OneSignal BERHENTI menyertakan kolom
                      # `recipients` di jawaban ({"id": "...", "external_id":
                      # null}) — aturan "id DAN penerima wajib" membaca kiriman
                      # yang sudah DITERIMA sebagai kosong, lanjut ke skema
                      # berikutnya (notifikasi terkirim DOBEL), dan run tetap
                      # merah. Sekarang: errors / id kosong = gagal;
                      # recipients 0 = tidak ada penerima; recipients yang
                      # TIDAK ADA sama sekali = diterima (bentuk API baru).
                      ident = hasil.get('id') or ''
                      penerima = hasil.get('recipients')
                      keliru = hasil.get('errors')
                      if keliru or not ident or penerima == 0:
                          print(f'  kosong — skema {skema}, segmen "{segmen}": '
                                f'{json.dumps(hasil, ensure_ascii=False)[:220]}')
                          continue
                      ket = (f'ke {penerima} perangkat' if penerima is not None
                             else 'diterima OneSignal (API baru tanpa hitungan penerima)')
                      print(f'  ✅ TERKIRIM {ket} — '
                            f'skema "{skema}", segmen "{segmen}", id {ident}')
                      terkirim = True
                      break
                  except urllib.error.HTTPError as e:
                      badan = e.read().decode(errors='replace')
                      if e.code in (401, 403):
                          print(f'  skema "{skema}" ditolak ({e.code}), coba berikutnya…')
                          ditolak_kunci = True
                          continue
                      # 409 = external_id ini sudah dipakai, artinya
                      # notifikasinya SUDAH dikirim (run kembar / percobaan
                      # sebelumnya). Itu hasil yang kita mau, bukan galat —
                      # pagar idempotennya justru sedang bekerja.
                      if e.code == 409:
                          print(f'  ✅ SUDAH PERNAH DIKIRIM (kunci {kunci_kiriman} '
                                f'sudah dipakai) — tidak dikirim dobel.')
                          terkirim = True
                          break
                      # JARING PENGAMAN: kalau OneSignal suatu saat tidak lagi
                      # menerima external_id, notifikasi artikel TIDAK boleh
                      # ikut mati gara-gara pagar anti-dobel. Kirim ulang tanpa
                      # kuncinya sekali, dan cetak peringatan supaya
                      # hilangnya pagar itu ketahuan, bukan senyap.
                      if e.code == 400 and 'external_id' in badan:
                          print(f'::warning::OneSignal menolak external_id '
                                f'({badan[:160]}). Dikirim ulang TANPA kunci '
                                f'idempoten — pagar anti-dobel tidak aktif '
                                f'untuk kiriman ini.')
                          tanpa_kunci = {k: v for k, v in muatan.items()
                                         if k != 'external_id'}
                          ulang = urllib.request.Request(
                              'https://api.onesignal.com/notifications',
                              data=json.dumps(tanpa_kunci).encode(),
                              headers={
                                  'Content-Type': 'application/json; charset=utf-8',
                                  'Authorization': f'{skema} {kunci}',
                              },
                              method='POST',
                          )
                          try:
                              with urllib.request.urlopen(ulang, timeout=30) as r:
                                  hasil = json.loads(r.read().decode())
                          except Exception as e2:
                              print(f'  gagal juga tanpa kunci: {e2}')
                              continue
                          if hasil.get('errors') or not hasil.get('id'):
                              print(f'  kosong — {json.dumps(hasil, ensure_ascii=False)[:220]}')
                              continue
                          print(f'  ✅ TERKIRIM (tanpa kunci idempoten) — '
                                f'skema "{skema}", segmen "{segmen}", '
                                f'id {hasil["id"]}')
                          terkirim = True
                          break
                      print(f'::error::Gagal kirim ({e.code}): {badan}')
                      break
                  except Exception as e:
                      print(f'::error::Gagal kirim: {e}')
                      break

              if not terkirim and ditolak_kunci:
                  print(f'::error::OneSignal MENOLAK KUNCINYA (401/403) untuk '
                        f'"{judul}" — bukan soal nama segmen. Secret '
                        f'ONESIGNAL_REST_API_KEY di repo INI (ikhlassyamri/BiB) '
                        f'sudah tidak berlaku; biasanya karena kuncinya diputar '
                        f'atau dibuat baru di OneSignal dan salinan di sini belum '
                        f'ikut diperbarui. Catat: repo agen punya salinannya '
                        f'SENDIRI — memperbarui satu tidak memperbarui yang lain. '
                        f'Perbaiki secretnya, lalu JALANKAN ULANG run ini supaya '
                        f'notifikasi yang terlewat tetap terkirim.')
                  gagal = True
              elif not terkirim:
                  print(f'::error::Tidak ada satu pun kombinasi skema x segmen yang '
                        f'menghasilkan notifikasi untuk "{judul}". Kuncinya diterima, '
                        f'jadi yang salah nama segmennya. Segmen yang dicoba: '
                        f'{", ".join(SEGMEN)}. Buka OneSignal → Audience → Segments, '
                        f'lihat nama segmen yang benar-benar ada, lalu tambahkan ke '
                        f'daftar SEGMEN di berkas alur ini.')
                  gagal = True

          sys.exit(1 if gagal else 0)
          PY
