<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>@IkhlasDigital — Ubah Skill Menjadi Produk Digital</title>
<meta name="theme-color" content="#0B0C0E">
<link rel="icon" type="image/png" href="logo-ID.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=Space+Grotesk:wght@600;700&display=swap" rel="stylesheet">
<style>
:root {
  --ink: #050505;
  --panel: #111214;
  --line: #26292F;
  --text: #F4F5F6;
  --muted: #9AA1A9;
  --accent: #76B900; 
  --disp: 'Space Grotesk', sans-serif;
  --body: 'Inter', sans-serif;
}

* { margin: 0; padding: 0; box-sizing: border-box; }

body {
  background: var(--ink);
  color: var(--text);
  font-family: var(--body);
  line-height: 1.6;
  display: flex;
  justify-content: center;
  min-height: 100vh;
  -webkit-font-smoothing: antialiased;
  background-image: radial-gradient(circle at 50% 20%, #151813 0%, var(--ink) 80%);
  overflow-x: hidden;
}

/* Banner Fentilasi GIF */
.header-banner {
  position: absolute;
  top: 0;
  left: 0;
  width: 100%;
  height: auto;
  z-index: 15;
  pointer-events: none;
}

/* Main Content Container */
.container {
  width: 100%;
  max-width: 480px;
  padding: 120px 24px 60px; 
  display: flex;
  flex-direction: column;
  align-items: center;
  position: relative;
  z-index: 10;
}

/* Profile Section */
.profile {
  text-align: center;
  margin-bottom: 35px;
}

/* Wrapper Logo Normal */
.avatar-wrapper {
  position: relative;
  width: 100px; 
  height: 100px;
  border-radius: 50%;
  background: #000;
  margin: 0 auto 16px;
  border: 1px solid #333;
  box-shadow: 0 10px 30px rgba(0,0,0,0.6);
  overflow: hidden; 
}

/* Logonya saja yang diperbesar dan presisi di tengah mutlak */
.avatar {
  position: absolute;
  top: 50%;
  left: 50%;
  transform: translate(-50%, -50%);
  width: 85%;
  height: auto;
  display: block;
}

.username {
  font-family: var(--disp);
  font-size: 1.5rem;
  font-weight: 700;
  color: #fff;
  margin-bottom: 8px;
  letter-spacing: -0.01em;
  display: flex;
  align-items: center;
  justify-content: center;
  gap: 8px;
}

.verified-badge {
  width: 20px;
  height: 20px;
  fill: var(--accent);
}

.bio {
  color: var(--muted);
  font-size: 0.95rem;
  max-width: 320px;
  margin: 0 auto;
  line-height: 1.5;
}

/* Links Section */
.links-wrapper {
  width: 100%;
  display: flex;
  flex-direction: column;
  gap: 16px;
}

.link-btn {
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  text-align: center;
  background: var(--panel);
  border: 1px solid #1f2226;
  padding: 20px 24px;
  border-radius: 20px;
  text-decoration: none;
  color: var(--text);
  transition: transform 0.2s ease, border-color 0.2s ease;
  position: relative;
}

.link-btn:hover {
  transform: translateY(-2px);
  border-color: #33383f;
}

/* Premium Button (Putih) */
.btn-primary {
  background: #ffffff;
  color: #000;
  border-color: #ffffff;
}
.btn-primary .title { color: #000; }
.btn-primary .sub { color: #555; }

.title {
  font-family: var(--disp);
  font-weight: 700;
  font-size: 1.1rem;
  margin-bottom: 6px;
  display: flex;
  align-items: center;
  gap: 6px;
}
.sub {
  font-size: 0.85rem;
  color: var(--muted);
  font-weight: 500;
}

.badge {
  position: absolute;
  top: 0;
  right: 24px;
  background: var(--accent);
  color: #000;
  font-size: 0.65rem;
  font-weight: 800;
  padding: 4px 10px;
  border-radius: 0 0 6px 6px;
  font-family: var(--disp);
  letter-spacing: 0.05em;
  text-transform: uppercase;
}

.text-green { color: var(--accent) !important; }

/* Footer */
.footer {
  margin-top: 50px;
  display: flex;
  align-items: center;
  gap: 10px;
  color: var(--muted);
  font-size: 0.8rem;
}
.footer img {
  height: 32px; 
  opacity: 0.8;
}
</style>
</head>
<body>

  <!-- Gambar Fentilasi & Kabel dalam format GIF biar animasinya jalan -->
  <img src="fentilasi01.gif" alt="Header Art" class="header-banner">

  <div class="container">
    
    <!-- Profil -->
    <div class="profile">
      <div class="avatar-wrapper">
        <img src="logo-ID.png" alt="ID Logo" class="avatar">
      </div>
      <h1 class="username">
        @IkhlasDigital
        <!-- Centang BiB -->
        <svg class="verified-badge" viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg">
          <path d="M12 2C6.5 2 2 6.5 2 12s4.5 10 10 10 10-4.5 10-10S17.5 2 12 2zm-1.1 14.6l-4.2-4.2 1.4-1.4 2.8 2.8 6.4-6.4 1.4 1.4-7.8 7.8z"/>
        </svg>
      </h1>
      <p class="bio">Ubah Skill & Pengetahuan Menjadi Produk Digital senilai Rp 1000.000.</p>
    </div>

    <!-- Links -->
    <div class="links-wrapper">

      <a href="https://joinbib.id/digital/sutradara-digital" class="link-btn btn-primary">
        <div class="badge">PREMIUM</div>
        <span class="title">E-Book Sutradara Digital 🎬</span>
        <span class="sub">Ubah Pengalaman Jadi E-Book Dalam 1 hari</span>
      </a>

      <a href="https://joinbib.id/digital/10template" class="link-btn">
        <span class="title">Cara Bikin Website Pake AI 💻</span>
        <span class="sub">Bonus 10 Template Website</span>
      </a>

      <a href="https://whatsapp.com/channel/0029VbD3xRK6LwHdluqg330X" class="link-btn">
        <span class="title text-green">Channel WhatsApp 🟢</span>
        <span class="sub">Belajar Gratis tentang AI, Jualan dan Konten</span>
      </a>

    </div>

    <!-- Footer -->
    <div class="footer">
      <span>Powered by</span>
      <img src="logobib.png" alt="BiB Logo">
    </div>

  </div>

</body>
</html>
