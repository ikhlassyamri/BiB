<html lang="id">
<head>
<meta charset="UTF-8">

<title>@IkhlasDigital — Ubah Skill Menjadi Produk Digital</title>

<style>
:root {
  --ink: #050505;
  --panel: #111214;
  --line: #26292F;
  --text: #F4F5F6;
  --muted: #9AA1A9;
  --accent: #76B900; 
  --disp: 'Space Grotesk', sans-serif;
  --body: 'Inter', sans-serif;
}

* { margin: 0; padding: 0; box-sizing: border-box; }

body {
  background: var(--ink);
  color: var(--text);
  font-family: var(--body);
  line-height: 1.6;
  display: flex;
  justify-content: center;
  min-height: 100vh;
  -webkit-font-smoothing: antialiased;
  background-image: radial-gradient(circle at 50% 20%, #151813 0%, var(--ink) 80%);
  overflow-x: hidden;
}

/* MODIFIKASI: Container pembungkus untuk banner dan efek animasi */
.header-container {
  position: absolute;
  top: 0;
  left: 0;
  width: 100%;
  z-index: 15;
  pointer-events: none;
}

/* Banner Fentilasi PNG */
.header-banner {
  width: 100%;
  height: auto;
  display: block;
}

/* MODIFIKASI: Efek Logo/Folder PDF Melayang */
.pdf-float {
  position: absolute;
  /* Posisi digeser ke kiri (41%) dan agak naik (22%) agar masuk ke lubang fentilasi */
  top: 22%; 
  left: 41%;
  transform: translate(-50%, -50%);
  
  width: 32px;
  height: 42px;
  background-color: #E53935;
  border-radius: 4px;
  display: flex;
  align-items: center;
  justify-content: center;
  color: white;
  font-weight: 800;
  font-size: 10px;
  font-family: var(--body);
  box-shadow: 0 5px 15px rgba(229, 57, 53, 0.5);
  
  /* Animasi melayang naik turun */
  animation: float-anim 3s ease-in-out infinite;
}

/* Hiasan lipatan folder di sudut kanan atas PDF */
.pdf-float::after {
  content: '';
  position: absolute;
  top: 0;
  right: 0;
  border-width: 0 10px 10px 0;
  border-style: solid;
  border-color: #2b0808 #2b0808 transparent transparent;
  display: block;
  width: 0;
  height: 0;
  border-radius: 0 4px 0 0;
}

@keyframes float-anim {
  0% { transform: translate(-50%, -50%); }
  50% { transform: translate(-50%, -75%); } /* Naik sedikit */
  100% { transform: translate(-50%, -50%); }
}

/* MODIFIKASI: Efek Percikan (Sparks) di ujung kabel */
.spark-container {
  position: absolute;
  /* Posisi di ujung kabel merah */
  top: 60%;
  left: 12%; 
}

.spark {
  position: absolute;
  width: 3px;
  height: 3px;
  background-color: #ffeb3b;
  border-radius: 50%;
  box-shadow: 0 0 8px 2px #ffc107, 0 0 15px 3px #ff9800;
  opacity: 0;
  /* Diubah menjadi 2 detik sekali */
  animation: spark-burst 2s infinite; 
}

/* Partikel dibuat memercik ke arah yang berbeda-beda */
.spark:nth-child(1) { animation-delay: 0s; }
.spark:nth-child(2) { animation-delay: 0.1s; animation-name: spark-burst-2; }
.spark:nth-child(3) { animation-delay: 0.05s; animation-name: spark-burst-3; }
.spark:nth-child(4) { animation-delay: 0.15s; animation-name: spark-burst-4; }

/* Logika Animasi (Skala waktu disesuaikan untuk durasi 2 detik) */
@keyframes spark-burst {
  0%, 90% { opacity: 0; transform: scale(0) translate(0, 0); }
  92% { opacity: 1; transform: scale(1.5) translate(-15px, 15px); }
  96% { opacity: 0; transform: scale(0.5) translate(-30px, 30px); }
  100% { opacity: 0; }
}
@keyframes spark-burst-2 {
  0%, 90% { opacity: 0; transform: scale(0) translate(0, 0); }
  92% { opacity: 1; transform: scale(1.2) translate(15px, 20px); }
  96% { opacity: 0; transform: scale(0.5) translate(25px, 40px); }
  100% { opacity: 0; }
}
@keyframes spark-burst-3 {
  0%, 90% { opacity: 0; transform: scale(0) translate(0, 0); }
  92% { opacity: 1; transform: scale(1.8) translate(0px, 25px); }
  96% { opacity: 0; transform: scale(0.5) translate(-10px, 50px); }
  100% { opacity: 0; }
}
@keyframes spark-burst-4 {
  0%, 90% { opacity: 0; transform: scale(0) translate(0, 0); }
  92% { opacity: 1; transform: scale(1.4) translate(20px, -5px); }
  96% { opacity: 0; transform: scale(0.5) translate(35px, -15px); }
  100% { opacity: 0; }
}

/* Main Content Container */
.container {
  width: 100%;
  max-width: 480px;
  padding: 120px 24px 60px; 
  display: flex;
  flex-direction: column;
  align-items: center;
  position: relative;
  z-index: 10;
}

/* Profile Section */
.profile {
  text-align: center;
  margin-bottom: 35px;
}

/* Wrapper Logo Normal */
.avatar-wrapper {
  position: relative;
  width: 100px; 
  height: 100px;
  border-radius: 50%;
  background: #000;
  margin: 0 auto 16px;
  border: 1px solid #333;
  box-shadow: 0 10px 30px rgba(0,0,0,0.6);
  overflow: hidden; 
}

/* Logonya saja yang diperbesar dan presisi di tengah mutlak */
.avatar {
  position: absolute;
  top: 50%;
  left: 50%;
  transform: translate(-50%, -50%);
  width: 85%;
  height: auto;
  display: block;
}

.username {
  font-family: var(--disp);
  font-size: 1.5rem;
  font-weight: 700;
  color: #fff;
  margin-bottom: 8px;
  letter-spacing: -0.01em;
  display: flex;
  align-items: center;
  justify-content: center;
  gap: 8px;
}

.verified-badge {
  width: 20px;
  height: 20px;
  fill: var(--accent);
}

.bio {
  color: var(--muted);
  font-size: 0.95rem;
  max-width: 320px;
  margin: 0 auto;
  line-height: 1.5;
}

/* Links Section */
.links-wrapper {
  width: 100%;
  display: flex;
  flex-direction: column;
  gap: 16px;
}

.link-btn {
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  text-align: center;
  background: var(--panel);
  border: 1px solid #1f2226;
  padding: 20px 24px;
  border-radius: 20px;
  text-decoration: none;
  color: var(--text);
  transition: transform 0.2s ease, border-color 0.2s ease;
  position: relative;
}

.link-btn:hover {
  transform: translateY(-2px);
  border-color: #33383f;
}

/* Premium Button (Putih) */
.btn-primary {
  background: #ffffff;
  color: #000;
  border-color: #ffffff;
}
.btn-primary .title { color: #000; }
.btn-primary .sub { color: #555; }

.title {
  font-family: var(--disp);
  font-weight: 700;
  font-size: 1.1rem;
  margin-bottom: 6px;
  display: flex;
  align-items: center;
  gap: 6px;
}
.sub {
  font-size: 0.85rem;
  color: var(--muted);
  font-weight: 500;
}

.badge {
  position: absolute;
  top: 0;
  right: 24px;
  background: var(--accent);
  color: #000;
  font-size: 0.65rem;
  font-weight: 800;
  padding: 4px 10px;
  border-radius: 0 0 6px 6px;
  font-family: var(--disp);
  letter-spacing: 0.05em;

.text-green { color: var(--accent) !important; }

/* Footer */
.footer {

  font-size: 0.8rem;
}
.footer img {
  height: 32px; 
  opacity: 0.8;
}
</style>
